name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ⭐ 关键：先装 Python 3.12.9，让它成为 hostpython3
      - name: Set up Python 3.12.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libtinfo-dev libffi-dev libssl-dev cmake zip unzip \
            git wget file

      - name: Install buildozer
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install --upgrade cython==0.29.36
          python -m pip install buildozer==1.5.0 python-for-android

      - name: Build APK
        env:
          BUILDOZER_LOG_LEVEL: 2
        run: |
          echo "=== Python 版本 ==="
          python --version
          which python
          echo ""
          echo "=== Buildozer 版本 ==="
          buildozer --version
          echo ""
          echo "=== 开始构建 ==="
          buildozer android debug
        timeout-minutes: 60

      - name: Show build artifacts
        run: |
          echo "=== bin/ 目录 ==="
          ls -la bin/ 2>/dev/null || echo "bin/ 目录不存在"
          echo ""
          echo "=== find APK 文件 ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "没找到 APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stockanalyzer-apk
          path: bin/*.apk
          if-no-files-found: error
