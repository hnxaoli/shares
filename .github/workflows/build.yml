name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          # libltdl-dev provides LT_SYS_SYMBOL_USCORE macro needed by p4a's autoreconf
          sudo apt-get install -y -qq autoconf automake autopoint libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libtinfo-dev libffi-dev libssl-dev \
            cmake zip unzip python3-pip python3-setuptools python3-wheel git wget file patch

      - name: Install buildozer
        run: |
          # ⚠️ 必须升 pip 到最新：p4a 创建 venv 时复制系统 pip，然后升级 venv pip
          # 如果系统 pip 太旧，升级时会导致 venv 内 pip 文件混搭（build_env.py 新 + spinners.py 旧）
          # → ImportError: cannot import name 'open_rich_spinner'
          python3 -m pip install --upgrade pip --break-system-packages
          pip3 install --upgrade cython==0.29.36 --break-system-packages
          pip3 install buildozer==1.5.0 python-for-android --break-system-packages
          # 验证 pip 完整（build_env.py 能成功 import spinners）
          python3 -c "from pip._internal.cli.spinners import open_rich_spinner; print('pip OK: open_rich_spinner available')"

      - name: Patch p4a (libffi + pip venv fallback)
        run: |
          P4A_DIR=$(python3 -c "import pythonforandroid; import os; print(os.path.dirname(pythonforandroid.__file__))")
          echo "p4a: $P4A_DIR"
          echo ""

          echo "=== 1. 覆盖 libffi recipe ==="
          sudo cp recipes/libffi/__init__.py "$P4A_DIR/recipes/libffi/__init__.py"
          sudo cp recipes/libffi/remove-version-info.patch "$P4A_DIR/recipes/libffi/remove-version-info.patch"

          echo ""
          echo "=== 2. patch_p4a.py: venv pip 升级前先 patch spinners.py ==="
          # 终极修法：build.py:878 创建 venv (hostpython3 3.11.9) 后升级 pip 会混搭
          # → 在 shell 命令里加 venv/bin/python -c patch，先给 venv 的 spinners.py 加 fallback
          python3 patch_p4a.py

          echo ""
          echo "=== Patch 完成 ==="

      - name: Build APK
        env:
          BUILDOZER_LOG_LEVEL: 2
        run: |
          echo "=== Python 版本 ==="
          python3 --version
          which python3
          echo ""
          echo "=== Buildozer 版本 ==="
          buildozer --version
          echo ""
          # ⚠️ 清理 .buildozer 缓存：残留 venv 里的 pip 文件混搭（build_env.py 新 + spinners.py 旧）
          # 导致 ImportError: cannot import name 'open_rich_spinner'
          echo "=== 清理 .buildozer 缓存 ==="
          rm -rf .buildozer
          echo "缓存已清理"
          echo ""
          echo "=== 开始构建 ==="
          buildozer android debug --local-recipes=recipes
        timeout-minutes: 90

      - name: Show build artifacts
        run: |
          echo "=== bin/ 目录 ==="
          ls -la bin/ 2>/dev/null || echo "bin/ 目录不存在"
          echo ""
          echo "=== find APK 文件 ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "没找到 APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stockanalyzer-apk
          path: bin/*.apk
          if-no-files-found: error
