name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libtinfo-dev libffi-dev libssl-dev cmake zip unzip \
            python3-pip python3-setuptools python3-wheel git wget file

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36
          pip install buildozer==1.5.0 python-for-android

      - name: Build APK
        run: buildozer android debug 2>&1 | tail -100
        timeout-minutes: 60

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stockanalyzer-apk
          path: bin/*.apk
          if-no-files-found: error
