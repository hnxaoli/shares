name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.12.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'

      - name: Replace system python3 with 3.12.9
        run: |
          echo "=== 替换前 ==="
          python --version
          python3 --version 2>/dev/null || true
          which python python3
          echo ""
          # 用 setup-python 的 3.12.9 替换 /usr/bin/python3
          PY312=$(which python)
          echo "Python 3.12.9 路径: $PY312"
          sudo ln -sf "$PY312" /usr/bin/python3
          sudo ln -sf "$PY312" /usr/bin/python
          echo ""
          echo "=== 替换后 ==="
          python --version
          python3 --version
          ls -la /usr/bin/python3 /usr/bin/python

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libtinfo-dev libffi-dev libssl-dev cmake zip unzip \
            git wget file

      - name: Install buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade cython==0.29.36
          python3 -m pip install buildozer==1.5.0 python-for-android

      - name: Build APK
        env:
          BUILDOZER_LOG_LEVEL: 2
        run: |
          echo "=== Python 版本 ==="
          python3 --version
          echo ""
          echo "=== Buildozer 版本 ==="
          buildozer --version
          echo ""
          echo "=== 开始构建 ==="
          buildozer android debug
        timeout-minutes: 60

      - name: Show build artifacts
        run: |
          echo "=== bin/ 目录 ==="
          ls -la bin/ 2>/dev/null || echo "bin/ 目录不存在"
          echo ""
          echo "=== find APK 文件 ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "没找到 APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stockanalyzer-apk
          path: bin/*.apk
          if-no-files-found: error
